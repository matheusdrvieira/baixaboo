name: baixaboo

services:
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    init: true
    expose:
      - "4416"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:4416/ping').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    init: true
    environment:
      API_KEY: ${API_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      POT_PROVIDER_URL: http://pot-provider:4416
      YTDLP_COOKIES_FILE: /run/secrets/youtube-cookies.txt
    secrets:
      - source: youtube_cookies
        target: youtube-cookies.txt
    ports:
      - "8010:8010"
    depends_on:
      pot-provider:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8010
        NEXT_PUBLIC_FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
        NEXT_PUBLIC_API_KEY: ${API_KEY}
    init: true
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8010
      NEXT_PUBLIC_FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      NEXT_PUBLIC_API_KEY: ${API_KEY}
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "3001:3001"
    restart: unless-stopped

secrets:
  youtube_cookies:
    file: ./secrets/youtube-cookies.txt
