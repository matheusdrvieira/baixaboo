name: baixaboo

services:
  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    environment:
      SESSION_SECRET: ${SESSION_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      YTDLP_COOKIES_FILE: /run/secrets/youtube-cookies.txt
    secrets:
      - source: youtube_cookies
        target: youtube-cookies.txt
    ports:
      - "8010:8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8010
        NEXT_PUBLIC_FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
    init: true
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8010
      NEXT_PUBLIC_FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "3001:3001"
    restart: unless-stopped

secrets:
  youtube_cookies:
    file: ./secrets/youtube-cookies.txt
